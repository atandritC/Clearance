[project]
name = "clearance"
version = "0.1.0"
description = "Permission-aware company knowledge assistant"
readme = "README.md"
authors = [
    { name = "Atandrit Chatterjee", email = "atandrit04chatterjee@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi[standard]>=0.162.4",
    "greenlet>=3.5.6",
    "groq>=1.7.0",
    "pwdlib[argon2]>=0.3.1",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.15.1",
    "qdrant-client[fastembed]>=1.20.0",
    "sqlalchemy>=2.1.8",
]

[project.scripts]
clearance = "clearance:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
