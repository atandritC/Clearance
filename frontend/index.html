<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#3C4044" />
    <meta name="description" content="Clearance — your company's knowledge, within reach." />
    <script>
      const themeMode = localStorage.getItem('clearance-theme-mode') || 'system';
      document.documentElement.dataset.theme = themeMode === 'system'
        ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        : themeMode;
    </script>
    <title>Clearance — your company, within reach</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
