<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Clearance — a permission-aware company knowledge assistant</title>
  <desc id="desc">A dark navy banner introducing Clearance. An abstract access boundary separates searchable team knowledge from restricted records and routes authorized evidence into a cited answer.</desc>
  <defs>
    <linearGradient id="bg" x1="74" y1="24" x2="1534" y2="510" gradientUnits="userSpaceOnUse">
      <stop stop-color="#091725"/>
      <stop offset=".56" stop-color="#10283A"/>
      <stop offset="1" stop-color="#183B50"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(0 260 -420 0 1328 108)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3E9DA6" stop-opacity=".32"/>
      <stop offset="1" stop-color="#3E9DA6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#DCEAF1" fill-opacity=".08"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-24%" width="140%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#020A10" flood-opacity=".4"/>
    </filter>
  </defs>
  <rect width="1600" height="520" rx="30" fill="url(#bg)"/>
  <rect width="1600" height="520" rx="30" fill="url(#glow)"/>
  <rect width="1600" height="520" rx="30" fill="url(#dots)"/>
  <path d="M0 436c251-48 450 31 699 19 303-14 515-90 901-42v107H0V436Z" fill="#040C13" fill-opacity=".26"/>

  <text x="100" y="117" fill="#8DD0CB" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3.1">PRIVATE KNOWLEDGE · GROUNDED ANSWERS</text>
  <text x="96" y="224" fill="#F4F8FA" font-family="Segoe UI,Arial,sans-serif" font-size="78" font-weight="700" letter-spacing="-2.5">Clearance</text>
  <text x="102" y="282" fill="#C8D9E2" font-family="Georgia,Times New Roman,serif" font-size="29">Knowledge with boundaries.</text>
  <path d="M103 319h64" stroke="#71C2BB" stroke-width="4" stroke-linecap="round"/>
  <text x="103" y="365" fill="#CBD8E0" font-family="Segoe UI,Arial,sans-serif" font-size="18">A company assistant that answers from evidence</text>
  <text x="103" y="394" fill="#CBD8E0" font-family="Segoe UI,Arial,sans-serif" font-size="18">each employee is allowed to see.</text>
  <text x="103" y="474" fill="#90AFC0" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="600" letter-spacing="1.4">FASTAPI  ·  LANGGRAPH  ·  QDRANT  ·  POSTGRESQL</text>

  <g filter="url(#shadow)" transform="translate(823 85)">
    <rect x="0" y="0" width="660" height="354" rx="22" fill="#0C1C29" fill-opacity=".94" stroke="#456276" stroke-width="1.5"/>
    <text x="34" y="43" fill="#91B8C4" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">ACCESS-AWARE RETRIEVAL</text>
    <path d="M34 63h592" stroke="#314D5E"/>

    <text x="36" y="103" fill="#EAF2F5" font-family="Segoe UI,Arial,sans-serif" font-size="15" font-weight="600">Employee asks a question</text>
    <rect x="36" y="119" width="259" height="50" rx="12" fill="#142B3A" stroke="#355365"/>
    <circle cx="59" cy="144" r="10" fill="#74C2BB" fill-opacity=".2"/>
    <path d="M55 144h8M59 140v8" stroke="#8DDED4" stroke-width="1.8" stroke-linecap="round"/>
    <text x="79" y="149" fill="#D9E6EA" font-family="Segoe UI,Arial,sans-serif" font-size="13">Trusted identity + active grants</text>

    <path d="M310 143h40" stroke="#6EC1B8" stroke-width="2" stroke-linecap="round"/>
    <path d="m343 137 8 6-8 6" stroke="#6EC1B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="362" y="117" width="263" height="54" rx="12" fill="#14343D" stroke="#39736F"/>
    <path d="M383 136h15v18h-15zM387 132h15v18" stroke="#9AE0D8" stroke-width="1.6" stroke-linejoin="round"/>
    <text x="412" y="140" fill="#A3DCD6" font-family="Segoe UI,Arial,sans-serif" font-size="10" font-weight="700" letter-spacing="1">SERVER-SIDE FILTER</text>
    <text x="412" y="156" fill="#E1EEEF" font-family="Segoe UI,Arial,sans-serif" font-size="12">Company · department · grants</text>

    <text x="36" y="208" fill="#91A9B5" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.6">DOCUMENT VISIBILITY</text>
    <rect x="36" y="222" width="174" height="58" rx="11" fill="#15363C" stroke="#438277"/>
    <circle cx="57" cy="251" r="9" fill="#70C9AE" fill-opacity=".18"/>
    <path d="m53 251 3 3 6-7" stroke="#92E3C5" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="74" y="247" fill="#D5E8E4" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Company guide</text>
    <text x="74" y="264" fill="#8DC6BA" font-family="Segoe UI,Arial,sans-serif" font-size="10">VISIBLE TO EMPLOYEE</text>

    <rect x="222" y="222" width="174" height="58" rx="11" fill="#152A38" stroke="#405665"/>
    <rect x="241" y="243" width="12" height="11" rx="2" stroke="#9AAEB7" stroke-width="1.4"/>
    <path d="M244 243v-4a3 3 0 0 1 6 0v4" stroke="#9AAEB7" stroke-width="1.4"/>
    <text x="265" y="247" fill="#CFDCE1" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">People record</text>
    <text x="265" y="264" fill="#93A8B2" font-family="Segoe UI,Arial,sans-serif" font-size="10">GRANT REQUIRED</text>

    <rect x="408" y="222" width="217" height="58" rx="11" fill="#152A38" stroke="#405665"/>
    <rect x="427" y="243" width="12" height="11" rx="2" stroke="#9AAEB7" stroke-width="1.4"/>
    <path d="M430 243v-4a3 3 0 0 1 6 0v4" stroke="#9AAEB7" stroke-width="1.4"/>
    <text x="451" y="247" fill="#CFDCE1" font-family="Segoe UI,Arial,sans-serif" font-size="12" font-weight="600">Other department</text>
    <text x="451" y="264" fill="#93A8B2" font-family="Segoe UI,Arial,sans-serif" font-size="10">FILTERED FROM SEARCH</text>

    <path d="M331 289v18" stroke="#6EC1B8" stroke-width="2" stroke-linecap="round"/>
    <path d="m325 302 6 7 6-7" stroke="#6EC1B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="36" y="311" width="589" height="27" rx="8" fill="#112F39"/>
    <text x="53" y="329" fill="#B7DDDA" font-family="Segoe UI,Arial,sans-serif" font-size="11" font-weight="600">AUTHORIZED EVIDENCE</text>
    <path d="M201 324h38" stroke="#538B87" stroke-width="1.5"/>
    <text x="253" y="329" fill="#E0ECEE" font-family="Segoe UI,Arial,sans-serif" font-size="11">Cited answer</text>
    <text x="543" y="329" fill="#94B7C1" font-family="Segoe UI,Arial,sans-serif" font-size="10">OR ABSTAIN</text>
  </g>
</svg>
